name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-without-torch:
    # `import pts` must not need torch or transformers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-deps -e . && pip install tqdm pytest
      - run: python -c "import pts; print('import pts ok without torch')"
      # The pure-Python layers: schema, storage, linking, exporters.
      - run: pytest tests/test_events.py tests/test_exporters.py tests/test_storage_and_linking.py -q

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-random-llama
      - run: pytest tests/ -q
