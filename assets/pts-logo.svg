<svg width="720" height="240" viewBox="0 0 720 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PTS — Pivotal Token Search">
  <defs>
    <linearGradient id="channels" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.33" stop-color="#A78BFA"/>
      <stop offset="0.33" stop-color="#38BDF8"/>
      <stop offset="0.66" stop-color="#38BDF8"/>
      <stop offset="0.66" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#241C4E" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0A0D13" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="718" height="238" rx="16" fill="#0A0D13" stroke="#212C3D" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="238" rx="16" fill="url(#glow)"/>
  <!-- three-channel signal bar -->
  <rect x="17" y="16" width="686" height="3" rx="1.5" fill="url(#channels)"/>

  <!-- graticule -->
  <g stroke="#1A2333" stroke-width="1" opacity="0.6">
    <line x1="17" y1="60" x2="703" y2="60"/>
    <line x1="17" y1="120" x2="703" y2="120"/>
    <line x1="17" y1="180" x2="703" y2="180"/>
  </g>

  <!-- wordmark -->
  <text x="44" y="112" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="76" font-weight="600" letter-spacing="-2" fill="#E7ECF5">PTS</text>
  <text x="48" y="150" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="18" font-weight="500" letter-spacing="6" fill="#A6B2C7">PIVOTAL&#160;TOKEN&#160;SEARCH</text>
  <text x="48" y="196" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" fill="#71809A">Pivotal reasoning events at three scales.</text>

  <!-- multiscale event marks on the right: latent diamonds -> token circles -> sentence bar -> outcome star -->
  <g transform="translate(430,0)">
    <!-- latent (violet diamonds) -->
    <g fill="#A78BFA">
      <rect x="18" y="52" width="13" height="13" transform="rotate(45 24.5 58.5)"/>
      <rect x="52" y="46" width="17" height="17" transform="rotate(45 60.5 54.5)" opacity="0.85"/>
      <rect x="92" y="54" width="11" height="11" transform="rotate(45 97.5 59.5)" opacity="0.7"/>
      <rect x="128" y="48" width="15" height="15" transform="rotate(45 135.5 55.5)"/>
      <rect x="170" y="55" width="10" height="10" transform="rotate(45 175 60)" opacity="0.6"/>
      <rect x="206" y="50" width="14" height="14" transform="rotate(45 213 57)" opacity="0.85"/>
    </g>
    <!-- links -->
    <g stroke="#94A3BE" stroke-width="1.2" opacity="0.4">
      <line x1="24" y1="66" x2="40" y2="112"/>
      <line x1="61" y1="63" x2="96" y2="112"/>
      <line x1="135" y1="63" x2="152" y2="112"/>
      <line x1="213" y1="64" x2="230" y2="112"/>
    </g>
    <!-- token (circles: green/rose) -->
    <circle cx="40" cy="120" r="9" fill="#34D399"/>
    <circle cx="96" cy="120" r="11" fill="#34D399"/>
    <circle cx="152" cy="120" r="9" fill="#FB7185"/>
    <circle cx="230" cy="120" r="10" fill="#34D399"/>
    <!-- sentence (amber bars) -->
    <rect x="30" y="168" width="70" height="16" rx="3" fill="#FBBF24" opacity="0.22"/>
    <rect x="30" y="168" width="5" height="16" rx="1.5" fill="#34D399"/>
    <rect x="140" y="168" width="110" height="16" rx="3" fill="#FBBF24" opacity="0.22"/>
    <rect x="140" y="168" width="5" height="16" rx="1.5" fill="#FB7185"/>
    <!-- outcome star -->
    <path d="M262 112 l4.5 9.3 10.2 1.5 -7.4 7.2 1.8 10.1 -9.1 -4.8 -9.1 4.8 1.8 -10.1 -7.4 -7.2 10.2 -1.5z" fill="#FBBF24"/>
  </g>
</svg>
